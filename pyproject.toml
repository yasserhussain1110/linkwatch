[project]
name = "zill"
version = "0.1.0"
description = "Find affiliate links that are failing to earn."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
zill = "zill.cli:main"
zill-web = "zill.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zill = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
