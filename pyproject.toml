[project]
name = "linkwatch"
version = "0.1.0"
description = "Find affiliate links that are failing to earn."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "fpdf2>=2.8",
  "httpx>=0.27",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
browser = ["playwright>=1.40"]

[project.scripts]
linkwatch = "linkwatch.cli:main"
linkwatch-web = "linkwatch.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linkwatch = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
